[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composio-scavio"
version = "0.4.1"
description = "Scavio real-time search tools for Composio: 189 tools over 32 platforms (Google, YouTube, Amazon, Walmart, eBay, Target, Home Depot, Reddit, TikTok, TikTok Shop, Instagram, X, LinkedIn, Threads, Kuaishou, Zillow, Redfin, Booking.com, Airbnb, Tripadvisor, Yelp, Indeed, Glassdoor, App Store, Google Play, SEC EDGAR, Companies House, G2, Capterra, Google Ads, Meta Ad Library) plus extract"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scavio", email = "scavio.dev@gmail.com" }]
keywords = ["composio", "scavio", "search", "agents", "tools", "serp", "google", "scraping", "extract", "ecommerce", "real-estate", "reviews", "jobs"]
dependencies = [
    "composio>=0.17.0",
    "scavio>=0.15.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://scavio.dev"
Repository = "https://github.com/scavio-ai/composio-scavio"
Documentation = "https://scavio.dev/docs"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["composio_scavio"]
