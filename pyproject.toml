[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "composio-scavio"
version = "0.6.1"
description = "Scavio real-time search tools for Composio: 199 tools over 33 platforms (Google, YouTube, Amazon, Walmart, eBay, Target, Home Depot, HEB, Kroger, Reddit, TikTok, TikTok Shop, Instagram, X, LinkedIn, Threads, Kuaishou, Zillow, Redfin, Booking.com, Airbnb, Tripadvisor, Yelp, Indeed, Glassdoor, App Store, Google Play, SEC EDGAR, Companies House, G2, Capterra, Google Ads, Meta Ad Library) plus extract, website map, crawl and batch"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Scavio", email = "scavio.dev@gmail.com" }]
keywords = ["composio", "scavio", "search", "agents", "tools", "serp", "google", "scraping", "extract", "web-crawler", "sitemap", "ecommerce", "real-estate", "reviews", "jobs"]
dependencies = [
    "composio>=0.17.0",
    "scavio>=0.27.0",
    "pydantic>=2.0",
]

[project.urls]
Homepage = "https://scavio.dev"
Repository = "https://github.com/scavio-ai/composio-scavio"
Documentation = "https://scavio.dev/docs"

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.hatch.build.targets.wheel]
packages = ["composio_scavio"]
